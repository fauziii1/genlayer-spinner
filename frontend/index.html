<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GenLayer TrustCheck</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <section class="card">
      <div class="brand"><span class="dot"></span> GenLayer TrustCheck</div>
      <h1>Check a claim against evidence</h1>
      <p class="intro">Submit a claim and an authoritative source. The Intelligent Contract evaluates the evidence and returns a consensus result.</p>
      <label>Claim<input id="claim" placeholder="Example: The source reports a new policy change." /></label>
      <label>Source URL<input id="source" type="url" placeholder="https://example.com/article" /></label>
      <button id="submit">Submit to GenLayer</button>
      <div id="status" class="status" aria-live="polite">Ready</div>
      <pre id="result" hidden></pre>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
