<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GenLayer Spinner Preview</title><link rel="stylesheet" href="genlayer-spinner.css"><style>body{margin:0;font:16px system-ui,sans-serif;background:#080b16;color:#fff}main{min-height:100vh;display:grid;place-items:center}.grid{display:flex;gap:40px;align-items:center;flex-wrap:wrap;justify-content:center}.panel{padding:40px;border-radius:20px;text-align:center;min-width:160px}.light{background:#f8fafc;color:#111827}.dark{background:#080b16}.panel .gl-spinner{margin:auto;--size:64px}</style></head><body><main><div class="grid"><section class="panel dark"><div class="gl-spinner" role="status" aria-label="Loading"></div><p>Dark</p></section><section class="panel light"><div class="gl-spinner" role="status" aria-label="Loading"></div><p>Light</p></section></div></main></body></html>
